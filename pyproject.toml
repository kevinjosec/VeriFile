[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifile"
dynamic = ["version"]
description = "Identify a file's real type from its content and verify its integrity"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Jose" }]
requires-python = ">=3.9"
keywords = ["file-type", "magic-number", "mime", "checksum", "sha256", "forensics", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "puremagic>=1.20",
]

[project.urls]
Homepage = "https://github.com/kevinjosec/VeriFile"
Repository = "https://github.com/kevinjosec/VeriFile"
Issues = "https://github.com/kevinjosec/VeriFile/issues"

[project.optional-dependencies]
# More accurate detection; also needs the native libmagic library on the system.
libmagic = ["python-magic>=0.4.27"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
verifile = "verifile.cli:run"

[tool.setuptools.dynamic]
version = { attr = "verifile.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
